name: keel-userd

on:
  push:
    paths:
      - "kits/userd-core/**"
      - "system/services/userd/**"
      - "system/core/userd.nix"
      - "system/core/default.nix"
      - "system/packages.nix"
      - "kits/nix/rustTool.nix"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/keel-userd.yml"
  pull_request:
    paths:
      - "kits/userd-core/**"
      - "system/services/userd/**"
      - "system/core/userd.nix"
      - "system/core/default.nix"
      - "system/packages.nix"
      - "kits/nix/rustTool.nix"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/keel-userd.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formato
        run: cargo fmt -p keel-userd-core -p keel-userd -- --check
      - name: Clippy
        run: |
          cargo clippy -p keel-userd-core -p keel-userd --all-targets -- -D warnings -W clippy::pedantic
          cargo clippy -p keel-userd --all-targets --features test-hooks -- -D warnings -W clippy::pedantic
      - name: Tests
        run: |
          cargo test -p keel-userd-core -p keel-userd
          cargo test -p keel-userd --features test-hooks

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluar el flake
        run: nix flake check --impure --no-build

      - name: nixosTest de keel-userd
        run: nix build .#checks.x86_64-linux.userd-f1 --print-build-logs
