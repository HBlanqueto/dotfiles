[package]
name = "nixdots-setup-gui"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
nixcore = { path = "../../kits/nixcore" }
localekit = { path = "../../kits/localekit" }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "backend-winit-wayland",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-18",
] }

[build-dependencies]
slint-build = "1.18.1"
