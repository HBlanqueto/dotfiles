# Cargo settings for the musl release targets.
[target.x86_64-unknown-linux-musl]
linker = "clang"
rustflags = [
    "-C", "target-cpu=x86-64-v2",
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,-O2",
    "-C", "link-arg=-Wl,--gc-sections",
]

[target.aarch64-unknown-linux-musl]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,-O2",
    "-C", "link-arg=-Wl,--gc-sections",
]
