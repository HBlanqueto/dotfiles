[package]
name = "nixdots-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
nixcore = { path = "../kits/nixcore" }
localekit = { path = "../kits/localekit" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tui-input = "0.15.5"
zeroize = "1"

[workspace]

[profile.release]
panic = "abort"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
