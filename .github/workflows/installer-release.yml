name: installer release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
    paths:
      - "installer/**"
      - "kits/nixcore/**"
      - "kits/localekit/**"
      - ".cargo/**"
      - "system/disko.nix"
      - "system/**"
      - "install.sh"
      - "dev.sh"
      - ".github/workflows/installer-release.yml"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install clang, lld and the embedded data tables
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld locales xkb-data tzdata

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: clang
          CC_aarch64_unknown_linux_musl: clang
          KEEL_LOCALES: /usr/share/i18n/SUPPORTED
          KEEL_LOCALE_DIR: /usr/share/i18n/locales
          KEEL_XKB_BASE_LST: /usr/share/X11/xkb/rules/base.lst
          KEEL_ZONE1970_TAB: /usr/share/zoneinfo/zone1970.tab
        run: cargo build --manifest-path installer/Cargo.toml --profile dist --locked --target ${{ matrix.target }}

      - name: Rename the binary
        run: |
          cp installer/target/${{ matrix.target }}/dist/nixdots-installer \
            nixdots-installer-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: nixdots-installer-${{ matrix.arch }}
          path: nixdots-installer-${{ matrix.arch }}

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum nixdots-installer-* > SHA256SUMS

      - name: Point the `latest` tag at this commit
        if: github.ref_type == 'branch'
        run: |
          git tag -f latest
          git push -f origin latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          prerelease: false
          make_latest: ${{ github.ref_type == 'branch' }}
          files: dist/*
